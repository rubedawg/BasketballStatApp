<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Stat Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.85em' font-size='90'%3E%F0%9F%8F%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --font-display:'Oswald',Impact,'Arial Narrow',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    /* light theme = default (scorer's paper sheet) */
    --bg:#F4F1E9; --surface:#FFFFFF; --surface-2:#FBF8F1; --surface-3:#EFEAE0;
    --border:#DAD3C2; --text:#1D1B16; --text-dim:#716B5C;
    --amber:#A66A0E; --amber-ink:#FFFFFF; --amber-soft:#F1D9AD;
    --teal:#0F7A6C; --teal-soft:#CFEAE4;
    --crimson:#B33A3A; --crimson-soft:#F0D6D3;
    --win:#2E7D46; --loss:#B33A3A; --tie:#8A6D1E; --pill-ink:#FFFFFF;
    --shadow: 0 1px 2px rgba(29,27,22,.06), 0 2px 8px rgba(29,27,22,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0D10; --surface:#15181C; --surface-2:#1B1F24; --surface-3:#22262C;
      --border:#2A2F36; --text:#EEEBE3; --text-dim:#9BA0A6;
      --amber:#FDB833; --amber-ink:#151515; --amber-soft:#4A390F;
      --teal:#3ED6C5; --teal-soft:#123330;
      --crimson:#F0656A; --crimson-soft:#3A1B1C;
      --win:#59CC7E; --loss:#F0656A; --tie:#D8C176; --pill-ink:#14120A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0D10; --surface:#15181C; --surface-2:#1B1F24; --surface-3:#22262C;
    --border:#2A2F36; --text:#EEEBE3; --text-dim:#9BA0A6;
    --amber:#FDB833; --amber-ink:#151515; --amber-soft:#4A390F;
    --teal:#3ED6C5; --teal-soft:#123330;
    --crimson:#F0656A; --crimson-soft:#3A1B1C;
    --win:#59CC7E; --loss:#F0656A; --tie:#D8C176; --pill-ink:#14120A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--amber-soft);}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  #app{max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}

  .content{flex:1; padding:14px 14px 12px; padding-bottom:88px;}

  /* ---------- Top bar ---------- */
  .topbar{
    padding:14px 16px 10px; display:flex; align-items:baseline; justify-content:space-between;
    max-width:560px; margin:0 auto; width:100%;
  }
  .topbar h1{font-family:var(--font-display); font-weight:600; font-size:1.15rem; letter-spacing:.01em; margin:0;}
  .topbar .teamedit{background:none;border:none;color:var(--text-dim);font-size:.8rem;padding:6px;border-radius:8px;}
  .topbar .teamedit:hover{color:var(--text);}

  /* ---------- Cards / sections ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);}
  .section-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--text-dim); font-weight:600; margin:18px 2px 8px;}
  .section-title:first-child{margin-top:2px;}

  /* ---------- Empty / start states ---------- */
  .hero{padding:34px 20px 30px; text-align:center;}
  .hero h2{font-family:var(--font-display); font-size:1.6rem; font-weight:600; margin:0 0 6px;}
  .hero p{color:var(--text-dim); font-size:.92rem; margin:0 0 22px; line-height:1.5;}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px; text-align:left;}
  .field label{font-size:.75rem; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}
  .field input, .field select{
    padding:12px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:1rem; width:100%;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:48px; padding:0 18px; border-radius:12px; border:1px solid transparent;
    font-weight:600; font-size:.95rem; background:var(--surface-2); color:var(--text);
    border-color:var(--border); transition:transform .08s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--amber); color:var(--amber-ink); border-color:var(--amber);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent; border-color:var(--border); color:var(--text-dim);}
  .btn-danger{background:transparent; border-color:var(--crimson); color:var(--crimson);}
  .btn:disabled{opacity:.45; pointer-events:none;}
  .btn-sm{min-height:38px; padding:0 12px; font-size:.85rem; border-radius:10px;}

  /* ---------- Roster list ---------- */
  .plist{display:flex; flex-direction:column; gap:8px;}
  .prow{display:flex; align-items:center; gap:12px; padding:11px 12px; background:var(--surface); border:1px solid var(--border); border-radius:12px;}
  .num-badge{
    font-family:var(--font-display); font-weight:600; font-size:.95rem;
    min-width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-3); border-radius:9px; color:var(--text);
  }
  .prow .pname{flex:1; font-weight:500;}
  .prow .rm{background:none;border:none;color:var(--text-dim);font-size:1.3rem;line-height:1;padding:6px 8px;border-radius:8px;}
  .prow .rm:hover{color:var(--crimson);}
  .addplayer{display:flex; gap:8px; margin-bottom:16px;}
  .addplayer input:first-child{width:72px; flex:none;}
  .addplayer input:last-child{flex:1;}

  /* ---------- Scoreboard ---------- */
  .scoreboard{padding:16px 18px 14px; text-align:center;}
  .sb-meta{font-size:.82rem; color:var(--text-dim); margin-bottom:10px;}
  .sb-score{display:flex; align-items:center; justify-content:center; gap:14px;}
  .sb-side{flex:1;}
  .sb-label{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); font-weight:600; margin-bottom:2px;}
  .sb-num{font-family:var(--font-display); font-weight:700; font-size:2.6rem; line-height:1; font-variant-numeric:tabular-nums; cursor:pointer;}
  .sb-us .sb-num{color:var(--amber);}
  .sb-dash{font-family:var(--font-display); font-size:1.6rem; color:var(--text-dim); font-weight:300;}
  .opp-controls{display:flex; gap:8px; justify-content:center; margin-top:12px;}
  .shooting-line{font-size:.78rem; color:var(--text-dim); margin-top:12px; font-variant-numeric:tabular-nums;}
  .recent-btn{position:absolute; top:14px; right:14px; background:var(--surface-3); border:none; color:var(--text-dim); font-size:.75rem; font-weight:600; padding:7px 10px; border-radius:20px;}
  .sb-wrap{position:relative;}

  /* ---------- Player accordion (live game) ---------- */
  .pcard{border:1px solid var(--border); border-radius:14px; background:var(--surface); margin-bottom:9px; overflow:hidden;}
  .phead{display:flex; align-items:center; gap:12px; padding:12px 13px; width:100%; background:none; border:none; text-align:left;}
  .phead .pname{flex:1; font-weight:500; color:var(--text);}
  .phead .ppts{font-family:var(--font-display); font-weight:600; font-size:1.2rem; color:var(--amber); font-variant-numeric:tabular-nums; min-width:28px; text-align:right;}
  .chev{color:var(--text-dim); transition:transform .15s ease; font-size:.8rem;}
  .pcard.open .chev{transform:rotate(90deg);}
  .pbody{padding:0 13px 14px; display:none;}
  .pcard.open .pbody{display:block;}
  .statline{font-size:.78rem; color:var(--text-dim); margin-bottom:10px; font-variant-numeric:tabular-nums; padding-top:2px; border-top:1px solid var(--border); padding-top:10px;}
  .btngrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:7px;}
  .stat-btn{
    min-height:46px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    font-weight:600; font-size:.82rem; color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15; gap:1px;
  }
  .stat-btn small{font-weight:500; font-size:.66rem; color:var(--text-dim);}
  .stat-btn.make{background:var(--amber-soft); border-color:var(--amber); color:var(--text);}
  .stat-btn.hustle{background:var(--teal-soft); border-color:var(--teal);}
  .stat-btn.neg{background:var(--crimson-soft); border-color:var(--crimson);}
  .stat-btn:active{transform:scale(.95);}

  /* ---------- End game ---------- */
  .endgame-wrap{margin-top:6px;}

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
    max-width:560px; margin:0 auto;
  }
  .tabbar.hidden{display:none;}
  .tab{flex:1; background:none; border:none; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-dim); font-size:.72rem; font-weight:600;}
  .tab .ic{font-size:1.2rem;}
  .tab.active{color:var(--amber);}

  /* ---------- Bottom sheet (recent activity) ---------- */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none;}
  .sheet-backdrop.show{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31; max-width:560px; margin:0 auto;
    background:var(--surface); border-radius:18px 18px 0 0; border:1px solid var(--border); border-bottom:none;
    max-height:70vh; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .22s ease;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.show{transform:translateY(0);}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; border-bottom:1px solid var(--border);}
  .sheet-head h3{font-family:var(--font-display); font-size:1.05rem; margin:0; font-weight:600;}
  .sheet-close{background:none; border:none; color:var(--text-dim); font-size:1rem; padding:6px;}
  .sheet-body{overflow-y:auto; padding:6px 8px;}
  .log-row{display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--border);}
  .log-row:last-child{border-bottom:none;}
  .log-row .ld{flex:1; font-size:.86rem;}
  .log-row .lt{font-size:.72rem; color:var(--text-dim);}
  .log-empty{padding:26px 10px; text-align:center; color:var(--text-dim); font-size:.85rem;}

  /* ---------- History ---------- */
  .subtabs{display:flex; gap:6px; margin-bottom:14px;}
  .subtab{flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); font-weight:600; font-size:.85rem; color:var(--text-dim);}
  .subtab.active{background:var(--amber); border-color:var(--amber); color:var(--amber-ink);}

  .grow{display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--surface); border:1px solid var(--border); border-radius:13px; margin-bottom:8px;}
  .result-pill{font-family:var(--font-display); font-weight:700; font-size:.85rem; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none;}
  .result-pill.W{background:var(--win); color:var(--pill-ink);}
  .result-pill.L{background:var(--loss); color:var(--pill-ink);}
  .result-pill.T{background:var(--tie); color:var(--pill-ink);}
  .grow .gscore{font-family:var(--font-display); font-weight:600; font-size:1.05rem; font-variant-numeric:tabular-nums;}
  .grow .gmeta{flex:1;}
  .grow .gopp{font-weight:500; font-size:.9rem;}
  .grow .gdate{font-size:.76rem; color:var(--text-dim);}

  .boxtable{width:100%; border-collapse:collapse; font-size:.78rem; margin-bottom:14px;}
  .boxtable th, .boxtable td{padding:8px 5px; text-align:center; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;}
  .boxtable th{color:var(--text-dim); font-weight:600; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; cursor:pointer;}
  .boxtable td:nth-child(2), .boxtable th:nth-child(2){text-align:left;}
  .boxtable tfoot td{font-weight:700; border-top:2px solid var(--border); border-bottom:none;}
  .table-scroll{overflow-x:auto; margin:0 -2px; padding:0 2px;}
  .boxwrap{margin-top:12px;}

  .empty-note{color:var(--text-dim); font-size:.88rem; text-align:center; padding:30px 16px; line-height:1.5;}

  .season-top{display:flex; gap:10px; margin-bottom:16px;}
  .stat-pill{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center;}
  .stat-pill .v{font-family:var(--font-display); font-weight:700; font-size:1.3rem;}
  .stat-pill .l{font-size:.68rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}

  .export-row{display:flex; justify-content:flex-end; margin-bottom:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h3>Recent activity</h3>
    <button class="sheet-close" data-action="closeSheet" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://llnazxvqvhbhchfbybxf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_LNVz-Up7_DD0bSx-2sK16Q_oE9JkWfD";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var uid = function(){
    if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
      return v.toString(16);
    });
  };

  // maps our in-app field name to the DB column (DB uses "tov" since TO is reserved)
  var FIELD_TO_DB = {fg2m:"fg2m",fg2a:"fg2a",fg3m:"fg3m",fg3a:"fg3a",ftm:"ftm",fta:"fta",
    reb:"reb",ast:"ast",stl:"stl",blk:"blk",to:"tov",pf:"pf"};

  var S = {
    teamName: "Toronto Lords U14",
    roster: [],
    activeGame: null,
    games: [],
    loaded: false,
    view: "live",
    historySub: "games",
    expandedPlayer: null,
    openGameId: null,
    showRecent: false,
    seasonSort: { field: "pts", dir: "desc" }
  };

  // ---------- stat helpers ----------
  var EMPTY_STATS = function(){
    return {fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,reb:0,ast:0,stl:0,blk:0,to:0,pf:0};
  };
  function rowToStats(r){
    return {fg2m:r.fg2m,fg2a:r.fg2a,fg3m:r.fg3m,fg3a:r.fg3a,ftm:r.ftm,fta:r.fta,
      reb:r.reb,ast:r.ast,stl:r.stl,blk:r.blk,to:r.tov,pf:r.pf};
  }

  var STAT_ACTIONS = {
    fg2m: {label:"2PT Made", also:["fg2a"], cls:"make"},
    fg2x: {label:"2PT Miss", also:[], cls:""},
    fg3m: {label:"3PT Made", also:["fg3a"], cls:"make"},
    fg3x: {label:"3PT Miss", also:[], cls:""},
    ftm:  {label:"FT Made",  also:["fta"], cls:"make"},
    ftx:  {label:"FT Miss",  also:[], cls:""},
    reb:  {label:"Rebound", also:[], cls:"hustle"},
    ast:  {label:"Assist",  also:[], cls:"hustle"},
    stl:  {label:"Steal",   also:[], cls:"hustle"},
    blk:  {label:"Block",   also:[], cls:"hustle"},
    to:   {label:"Turnover",also:[], cls:"neg"},
    pf:   {label:"Foul",    also:[], cls:"neg"}
  };

  function calcPts(st){ return (st.fg2m||0)*2 + (st.fg3m||0)*3 + (st.ftm||0); }

  function teamScore(game){
    var t = 0;
    for(var pid in game.stats){ t += calcPts(game.stats[pid]); }
    return t;
  }

  function fmtDate(iso){
    if(!iso) return "";
    var parts = iso.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }

  function logErr(where, error){ if(error) console.error(where, error); }

  // ---------- fetching shared state from Supabase ----------
  async function fetchSettings(){
    var res = await sb.from("settings").select("team_name").eq("id", true).single();
    logErr("fetchSettings", res.error);
    if(res.data) S.teamName = res.data.team_name;
  }

  async function fetchRoster(){
    var res = await sb.from("players").select("*").eq("active", true).order("created_at");
    logErr("fetchRoster", res.error);
    S.roster = (res.data||[]).map(function(p){ return {id:p.id, number:p.number, name:p.name}; });
  }

  async function fetchActiveGame(){
    var gRes = await sb.from("games").select("*").eq("status","live").maybeSingle();
    logErr("fetchActiveGame", gRes.error);
    var game = gRes.data;
    if(!game){ S.activeGame = null; return; }
    var sRes = await sb.from("game_stats").select("*").eq("game_id", game.id);
    var lRes = await sb.from("game_log").select("*").eq("game_id", game.id).order("ts");
    logErr("fetchActiveGame stats", sRes.error);
    logErr("fetchActiveGame log", lRes.error);
    var statsRows = sRes.data || [];
    var stats = {};
    var players = statsRows.map(function(r){
      stats[r.player_id] = rowToStats(r);
      return {id:r.player_id, number:r.player_number, name:r.player_name};
    });
    S.activeGame = {
      id: game.id, opponent: game.opponent, date: game.date, oppScore: game.opp_score,
      players: players, stats: stats,
      log: (lRes.data||[]).map(function(r){
        return {id:r.id, ts:new Date(r.ts).getTime(), type:r.type, playerId:r.player_id,
          playerLabel:r.player_label, actionLabel:r.action_label, fields:r.fields};
      })
    };
  }

  async function fetchHistory(){
    var gRes = await sb.from("games").select("*").eq("status","final").order("date",{ascending:false}).order("created_at",{ascending:false});
    logErr("fetchHistory games", gRes.error);
    var games = gRes.data || [];
    var ids = games.map(function(g){ return g.id; });
    var statsRows = [];
    if(ids.length){
      var sRes = await sb.from("game_stats").select("*").in("game_id", ids);
      logErr("fetchHistory stats", sRes.error);
      statsRows = sRes.data || [];
    }
    var byGame = {};
    statsRows.forEach(function(r){
      if(!byGame[r.game_id]) byGame[r.game_id] = {players:[], stats:{}};
      byGame[r.game_id].players.push({id:r.player_id, number:r.player_number, name:r.player_name});
      byGame[r.game_id].stats[r.player_id] = rowToStats(r);
    });
    S.games = games.map(function(g){
      var extra = byGame[g.id] || {players:[], stats:{}};
      return {
        id:g.id, opponent:g.opponent, date:g.date, oppScore:g.opp_score,
        players: extra.players, stats: extra.stats,
        finalUs: g.final_us, finalThem: g.final_them, result: g.result
      };
    });
  }

  async function refetchAll(){
    await Promise.all([fetchSettings(), fetchRoster(), fetchActiveGame(), fetchHistory()]);
  }

  // ---------- game actions ----------
  async function startGame(opponent, date){
    var gid = uid();
    var players = S.roster.map(function(p){ return {id:p.id, name:p.name, number:p.number}; });
    var stats = {};
    players.forEach(function(p){ stats[p.id] = EMPTY_STATS(); });
    S.activeGame = { id: gid, opponent: opponent || "Opponent", date: date || todayISO(),
      players: players, stats: stats, oppScore: 0, log: [] };
    S.expandedPlayer = null;
    render();

    var gameRes = await sb.from("games").insert({id: gid, opponent: opponent || "Opponent", date: date || todayISO(), status:"live", opp_score:0});
    if(gameRes.error){
      logErr("startGame", gameRes.error);
      alert("Couldn't start the game \u2014 someone may have just started one from another device. Reloading.");
      await refetchAll(); render();
      return;
    }
    var rows = players.map(function(p){ return {game_id: gid, player_id: p.id, player_number: p.number, player_name: p.name}; });
    if(rows.length){
      var statsRes = await sb.from("game_stats").insert(rows);
      logErr("startGame stats insert", statsRes.error);
    }
  }

  function ensurePlayerStats(pid){
    if(!S.activeGame.stats[pid]) S.activeGame.stats[pid] = EMPTY_STATS();
  }

  async function recordPlayerAction(pid, actionKey){
    var g = S.activeGame; if(!g) return;
    ensurePlayerStats(pid);
    var spec = STAT_ACTIONS[actionKey];
    var primaryField = ({fg2m:"fg2m",fg2x:"fg2a",fg3m:"fg3m",fg3x:"fg3a",ftm:"ftm",ftx:"fta",
                          reb:"reb",ast:"ast",stl:"stl",blk:"blk",to:"to",pf:"pf"})[actionKey];
    var changed = [{field:primaryField, delta:1}];
    spec.also.forEach(function(f){ changed.push({field:f, delta:1}); });

    changed.forEach(function(c){ g.stats[pid][c.field] = (g.stats[pid][c.field]||0) + c.delta; });
    var pl = g.players.find(function(p){return p.id===pid;});
    var logId = uid(), nowIso = new Date().toISOString();
    var logEntry = { id: logId, ts: Date.now(), type:"player", playerId: pid,
      playerLabel: pl ? ("#"+pl.number+" "+pl.name) : "Player",
      actionLabel: spec.label, fields: changed };
    g.log.push(logEntry);
    render();

    var calls = changed.map(function(c){
      return sb.rpc("increment_game_stat", {p_game_id: g.id, p_player_id: pid, p_field: FIELD_TO_DB[c.field], p_delta: c.delta});
    });
    calls.push(sb.from("game_log").insert({id: logId, game_id: g.id, ts: nowIso, type:"player",
      player_id: pid, player_label: logEntry.playerLabel, action_label: spec.label, fields: changed}));
    var results = await Promise.all(calls);
    results.forEach(function(r){ logErr("recordPlayerAction", r.error); });
  }

  async function recordOppPoints(delta){
    var g = S.activeGame; if(!g) return;
    g.oppScore = Math.max(0, g.oppScore + delta);
    var logId = uid(), nowIso = new Date().toISOString();
    var label = (delta>0?"+":"")+delta+" pts";
    g.log.push({id:logId, ts:Date.now(), type:"opp", delta: delta, playerLabel:"Opponent", actionLabel: label});
    render();

    var r1 = await sb.rpc("increment_opp_score", {p_game_id: g.id, p_delta: delta});
    logErr("recordOppPoints", r1.error);
    var r2 = await sb.from("game_log").insert({id: logId, game_id: g.id, ts: nowIso, type:"opp",
      player_label:"Opponent", action_label: label, fields: {delta: delta}});
    logErr("recordOppPoints log", r2.error);
  }

  async function setOppScoreDirect(){
    var g = S.activeGame; if(!g) return;
    var cur = g.oppScore;
    var val = window.prompt("Set opponent score", String(cur));
    if(val === null) return;
    var n = parseInt(val, 10);
    if(isNaN(n) || n < 0) return;
    var delta = n - cur;
    if(delta === 0) return;
    g.oppScore = n;
    var logId = uid(), nowIso = new Date().toISOString();
    var label = "Score set to "+n;
    g.log.push({id:logId, ts:Date.now(), type:"opp", delta: delta, playerLabel:"Opponent", actionLabel: label});
    render();

    var r1 = await sb.from("games").update({opp_score: n, updated_at: nowIso}).eq("id", g.id);
    logErr("setOppScoreDirect", r1.error);
    var r2 = await sb.from("game_log").insert({id: logId, game_id: g.id, ts: nowIso, type:"opp",
      player_label:"Opponent", action_label: label, fields: {delta: delta}});
    logErr("setOppScoreDirect log", r2.error);
  }

  async function undoLogEntry(entryId){
    var g = S.activeGame; if(!g) return;
    var idx = g.log.findIndex(function(e){return e.id===entryId;});
    if(idx === -1) return;
    var entry = g.log[idx];
    var calls = [];
    if(entry.type === "player"){
      ensurePlayerStats(entry.playerId);
      entry.fields.forEach(function(f){
        g.stats[entry.playerId][f.field] = Math.max(0, (g.stats[entry.playerId][f.field]||0) - f.delta);
        calls.push(sb.rpc("increment_game_stat", {p_game_id: g.id, p_player_id: entry.playerId, p_field: FIELD_TO_DB[f.field], p_delta: -f.delta}));
      });
    } else if(entry.type === "opp"){
      g.oppScore = Math.max(0, g.oppScore - entry.delta);
      calls.push(sb.rpc("increment_opp_score", {p_game_id: g.id, p_delta: -entry.delta}));
    }
    g.log.splice(idx,1);
    render();

    calls.push(sb.from("game_log").delete().eq("id", entryId));
    var results = await Promise.all(calls);
    results.forEach(function(r){ logErr("undoLogEntry", r.error); });
  }

  async function endGame(){
    var g = S.activeGame; if(!g) return;
    var us = teamScore(g);
    var them = g.oppScore;
    var result = us>them ? "W" : (us<them ? "L" : "T");
    var finished = { id: g.id, opponent: g.opponent, date: g.date, players: g.players,
      stats: g.stats, oppScore: g.oppScore, finalUs: us, finalThem: them, result: result };
    S.games.unshift(finished);
    S.activeGame = null;
    S.view = "history";
    S.historySub = "games";
    S.openGameId = finished.id;
    render();

    var r = await sb.from("games").update({status:"final", final_us:us, final_them:them,
      result: result, updated_at: new Date().toISOString()}).eq("id", finished.id);
    logErr("endGame", r.error);
  }

  // ---------- CSV export ----------
  function csvEscape(v){
    v = String(v);
    if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }
  function rowCsv(arr){ return arr.map(csvEscape).join(",") + "\r\n"; }

  function exportGameCsv(game){
    var head = "vs "+game.opponent+","+game.date+"\r\nFinal,"+ (game.finalUs!=null?game.finalUs:teamScore(game)) +"-"+game.oppScore+"\r\n\r\n";
    var csv = head + rowCsv(["#","Name","PTS","REB","AST","STL","BLK","TO","PF","FGM","FGA","3PM","3PA","FTM","FTA"]);
    game.players.forEach(function(p){
      var s = game.stats[p.id] || EMPTY_STATS();
      csv += rowCsv([p.number, p.name, calcPts(s), s.reb, s.ast, s.stl, s.blk, s.to, s.pf,
        s.fg2m, s.fg2a, s.fg3m, s.fg3a, s.ftm, s.fta]);
    });
    doDownload("game-"+game.date+"-vs-"+game.opponent.replace(/[^a-z0-9]+/gi,"-")+".csv", csv);
  }

  function exportSeasonCsv(rows){
    var csv = rowCsv(["Name","GP","PTS","PPG","REB","AST","STL","BLK","TO","PF"]);
    rows.forEach(function(r){
      csv += rowCsv([r.name, r.gp, r.pts, r.ppg, r.reb, r.ast, r.stl, r.blk, r.to, r.pf]);
    });
    doDownload("season-totals.csv", csv);
  }

  function doDownload(filename, csv){
    try{
      var blob = new Blob([csv], {type:"text/csv"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){}
  }

  // ---------- season aggregation ----------
  function seasonRows(){
    var byId = {};
    S.games.forEach(function(g){
      g.players.forEach(function(p){
        var s = g.stats[p.id];
        if(!s) return;
        var played = calcPts(s)+s.reb+s.ast+s.stl+s.blk+s.to+s.pf+s.fg2a+s.fg3a+s.fta > 0;
        if(!byId[p.id]) byId[p.id] = {id:p.id, name:p.name, number:p.number, gp:0,
          pts:0, reb:0, ast:0, stl:0, blk:0, to:0, pf:0};
        var r = byId[p.id];
        if(played) r.gp += 1;
        r.pts += calcPts(s); r.reb += s.reb; r.ast += s.ast; r.stl += s.stl;
        r.blk += s.blk; r.to += s.to; r.pf += s.pf;
      });
    });
    var rows = Object.keys(byId).map(function(k){
      var r = byId[k];
      r.ppg = r.gp ? Math.round((r.pts/r.gp)*10)/10 : 0;
      return r;
    });
    var f = S.seasonSort.field, dir = S.seasonSort.dir === "asc" ? 1 : -1;
    rows.sort(function(a,b){ return (a[f]-b[f]) * dir; });
    return rows;
  }

  // ---------- rendering ----------
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){
    var app = document.getElementById("app");
    if(!S.loaded){
      app.innerHTML = renderTopbar() + '<div class="content"><div class="hero"><h2>Loading\u2026</h2><p>Pulling the latest roster and season data.</p></div></div>';
      var tb = document.getElementById("tabbarFixed");
      if(tb) tb.remove();
      renderSheet();
      bindOnce();
      return;
    }
    var showTabs = S.roster.length > 0;
    var html = "";
    html += renderTopbar();
    html += '<div class="content">';
    if(S.roster.length === 0){
      html += renderRoster(true);
    } else if(S.view === "live"){
      html += renderLive();
    } else if(S.view === "history"){
      html += renderHistory();
    } else if(S.view === "roster"){
      html += renderRoster(false);
    }
    html += '</div>';
    app.innerHTML = html;

    renderTabbar(showTabs);
    renderSheet();
    bindOnce();

  function renderSheet(){
    var backdrop = document.getElementById("sheetBackdrop");
    var sheet = document.getElementById("sheet");
    var body = document.getElementById("sheetBody");
    if(S.showRecent){ backdrop.classList.add("show"); sheet.classList.add("show"); }
    else { backdrop.classList.remove("show"); sheet.classList.remove("show"); }
    var g = S.activeGame;
    if(!g){ body.innerHTML = '<div class="log-empty">No active game.</div>'; return; }
    if(g.log.length === 0){ body.innerHTML = '<div class="log-empty">No activity logged yet.</div>'; return; }
    var html = "";
    for(var i=g.log.length-1; i>=0; i--){
      var e = g.log[i];
      html += '<div class="log-row"><div class="ld">'+esc(e.playerLabel)+' \u00b7 '+esc(e.actionLabel)+'</div>'+
        '<button class="btn btn-sm btn-ghost" data-action="undoEntry" data-id="'+e.id+'">Undo</button></div>';
    }
    body.innerHTML = html;
  }

  // ---------- event delegation ----------
  var bound = false;
  function bindOnce(){
    if(bound) return;
    bound = true;
    document.body.addEventListener("click", onClick);
    document.body.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        if(e.target && e.target.id === "addName"){ addPlayerFromInputs(); }
        if(e.target && e.target.dataset && e.target.dataset.action === "editOpp"){ setOppScoreDirect(); }
      }
    });
    document.body.addEventListener("change", function(e){
      if(e.target && e.target.id === "teamNameInput"){ setTeamName(e.target.value); }
    });
  }

  function addPlayerFromInputs(){
    var num = document.getElementById("addNum");
    var name = document.getElementById("addName");
    if(!name) return;
    addPlayer(num.value, name.value);
  }

  function onClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.dataset.action;
    switch(action){
      case "setView":
        S.view = el.dataset.view; S.expandedPlayer=null; render(); break;
      case "addPlayer":
        addPlayerFromInputs(); break;
      case "removePlayer":
        removePlayer(el.dataset.id); break;
      case "startGame": {
        var opp = document.getElementById("oppName").value.trim();
        var date = document.getElementById("gameDate").value || todayISO();
        if(!opp){ document.getElementById("oppName").focus(); return; }
        startGame(opp, date);
        break;
      }
      case "togglePlayer":
        S.expandedPlayer = (S.expandedPlayer === el.dataset.id) ? null : el.dataset.id;
        render(); break;
      case "statAction":
        recordPlayerAction(el.dataset.id, el.dataset.key); break;
      case "oppPts":
        recordOppPoints(parseInt(el.dataset.pts,10)); break;
      case "editOpp":
        setOppScoreDirect(); break;
      case "openSheet":
        S.showRecent = true; render(); break;
      case "closeSheet":
        S.showRecent = false; render(); break;
      case "undoEntry":
        undoLogEntry(el.dataset.id); break;
      case "endGame":
        if(window.confirm("End the game and save the box score?")) endGame();
        break;
      case "histSub":
        S.historySub = el.dataset.sub; render(); break;
      case "toggleGame":
        S.openGameId = (S.openGameId === el.dataset.id) ? null : el.dataset.id;
        render(); break;
      case "exportGame": {
        var gm = S.games.find(function(x){return x.id===el.dataset.id;});
        if(gm) exportGameCsv(gm);
        break;
      }
      case "exportSeason":
        exportSeasonCsv(seasonRows()); break;
      case "sortSeason": {
        var f = el.dataset.field;
        if(S.seasonSort.field === f){ S.seasonSort.dir = S.seasonSort.dir === "desc" ? "asc" : "desc"; }
        else { S.seasonSort = {field:f, dir:"desc"}; }
        render(); break;
      }
    }
  }

  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "sheetBackdrop"){ S.showRecent = false; render(); }
  });

  // ---------- realtime ----------
  var refetchTimer = null;
  function scheduleRefetch(){
    clearTimeout(refetchTimer);
    refetchTimer = setTimeout(async function(){
      await refetchAll();
      render();
    }, 200);
  }

  function subscribeRealtime(){
    sb.channel("stat-tracker-changes")
      .on("postgres_changes", {event:"*", schema:"public", table:"players"}, scheduleRefetch)
      .on("postgres_changes", {event:"*", schema:"public", table:"games"}, scheduleRefetch)
      .on("postgres_changes", {event:"*", schema:"public", table:"game_stats"}, scheduleRefetch)
      .on("postgres_changes", {event:"*", schema:"public", table:"game_log"}, scheduleRefetch)
      .on("postgres_changes", {event:"*", schema:"public", table:"settings"}, scheduleRefetch)
      .subscribe();
  }

  // ---------- boot ----------
  async function boot(){
    render();
    await refetchAll();
    S.loaded = true;
    render();
    subscribeRealtime();
  }

  boot();
})();
</script>
</body>
</html>
